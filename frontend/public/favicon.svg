<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Squircle Container -->
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Clinical Blue to Electric Cyan Gradient -->
    <linearGradient id="favicon-blue" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Emergency Life Pulse Gradient -->
    <linearGradient id="favicon-rose" x1="26" y1="26" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Pet Healthcare Emerald Gradient -->
    <linearGradient id="favicon-emerald" x1="42" y1="6" x2="58" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Dark Premium Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favicon-bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Main Heart-Shield Body -->
  <path
    d="M 32 53 C 28 49 12 37 12 22.5 C 12 14.2 18.5 9 26 9 C 29.5 9 31.8 10.8 32 11.4 C 32.2 10.8 34.5 9 38 9 C 45.5 9 52 14.2 52 22.5 C 52 37 36 49 32 53 Z"
    fill="url(#favicon-blue)"
  />

  <!-- Clinical Cross (Pure Crisp White) -->
  <path
    d="M 32 19 V 37 M 23 28 H 41"
    stroke="#FFFFFF"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Center Emergency Blood / Pulse Node -->
  <circle cx="32" cy="28" r="3" fill="url(#favicon-rose)" />

  <!-- Pet Healthcare Satellite Pods (Paw signature) -->
  <circle cx="46" cy="8.5" r="2.4" fill="url(#favicon-emerald)" />
  <circle cx="52" cy="13.2" r="2.8" fill="url(#favicon-emerald)" />
  <circle cx="55.2" cy="20" r="2.4" fill="url(#favicon-emerald)" />
</svg>
